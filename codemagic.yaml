workflows:
  android-workflow:
    name: Build Modular Android APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Build Android Debug APK
        script: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/**/*.apk
