workflows:
  android-workflow:
    name: Modular Android Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build Android Debug APK
        script: |
          # If the user opened the project in Android Studio, gradlew will exist.
          # Otherwise, we fallback to the system gradle provided by Codemagic.
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - yourmail@example.com # You can change this to your email
        notify:
          success: true
          failure: true
